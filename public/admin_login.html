<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cheetos Finder — Admin Login</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    header { display:flex; align-items:center; justify-content:space-between }
    textarea { width:100%; height:100px; }
    .grid { display:grid; grid-template-columns: 1fr 300px; gap: 16px; }
    .results { background:#f7f7f7; padding:12px; border-radius:6px; height:300px; overflow:auto }
    .row { display:flex; gap:8px; margin-bottom:8px }
    .ip-item { padding:6px 8px; background:#fff; border-radius:4px; margin-bottom:6px; border:1px solid #eee }
    .alive { color:green }
    .dead { color:red }
    .controls { display:flex; gap:8px; flex-wrap:wrap }
    .muted { color:#666; font-size:0.9em }
  </style>
</head>
<body>
  <header>
    <h1>Cheetos Finder — Admin</h1>
    <div class="muted">Auto Ping — Nowość 2026</div>
  </header>

  <p>Panel admina — możesz wykonywać pingi tutaj lub używać głównego narzędzia.</p>

  <div class="grid">
    <div>
      <label for="ip-input">Wprowadź IP (po jednym w wierszu lub oddzielone przecinkiem):</label>
      <textarea id="ip-input" placeholder="1.2.3.4\n5.6.7.8"></textarea>

      <div class="controls" style="margin-top:8px">
        <button id="ping-one">Pinguj pierwszy</button>
        <button id="ping-all">Pinguj wszystkie</button>
        <button id="start-auto">Start Auto Ping</button>
        <button id="stop-auto" disabled>Stop Auto Ping</button>
        <label style="display:flex;align-items:center;gap:6px;margin-left:8px"><span class="muted">Interwał (s)</span><input id="interval" type="number" min="5" value="30" style="width:72px;margin-left:6px"/></label>
      </div>

      <div style="margin-top:12px">
        <label for="timeout">Timeout (s)</label>
        <input id="timeout" type="number" min="1" value="5" style="width:80px;margin-left:6px"/>
      </div>

    </div>

    <div>
      <div class="results" id="results">Brak wyników yet.</div>
    </div>
  </div>

  <script src="/js/ping.js"></script>
  <script>
    // reuse main ping.js functions if present, otherwise include simple inline handlers
    (function(){
      const textarea = document.getElementById('ip-input');
      const pingOneBtn = document.getElementById('ping-one');
      const pingAllBtn = document.getElementById('ping-all');
      const startAutoBtn = document.getElementById('start-auto');
      const stopAutoBtn = document.getElementById('stop-auto');
      const intervalInput = document.getElementById('interval');
      const timeoutInput = document.getElementById('timeout');
      const resultsEl = document.getElementById('results');
      let autoHandle = null;

      function parseIps(text) {
        if (!text) return [];
        return text.split(/\s*[\n,]+\s*/).map(s => s.trim()).filter(Boolean);
      }

      async function pingOne() {
        const ips = parseIps(textarea.value);
        if (!ips.length) return alert('Wprowadź przynajmniej jedno IP');
        const ip = ips[0];
        try {
          const timeout = parseInt(timeoutInput.value || '5', 10);
          const res = await fetch(`/api/ping?ip=${encodeURIComponent(ip)}&timeout=${timeout}`);
          if (!res.ok) throw new Error(await res.text());
          const json = await res.json();
          resultsEl.innerHTML = JSON.stringify(json, null, 2);
        } catch (err) {
          resultsEl.innerHTML = 'Błąd: ' + err.message;
        }
      }

      async function pingAll() {
        const ips = parseIps(textarea.value);
        if (!ips.length) return alert('Wprowadź przynajmniej jedno IP');
        try {
          const timeout = parseInt(timeoutInput.value || '5', 10);
          const res = await fetch('/api/ping-multi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ips, timeout, concurrency: 10 })
          });
          if (!res.ok) throw new Error(await res.text());
          const json = await res.json();
          resultsEl.innerHTML = json.map(r => `${r.ip} -> ${r.alive ? 'OK '+(r.time||r.ping_ms) : 'DOWN'}`).join('\n');
        } catch (err) {
          resultsEl.innerHTML = 'Błąd: ' + err.message;
        }
      }

      pingOneBtn.addEventListener('click', pingOne);
      pingAllBtn.addEventListener('click', pingAll);
      startAutoBtn.addEventListener('click', ()=>{
        if (autoHandle) return;
        const intervalSec = Math.max(5, parseInt(intervalInput.value||'30',10));
        pingAll();
        autoHandle = setInterval(pingAll, intervalSec*1000);
        startAutoBtn.disabled = true; stopAutoBtn.disabled = false;
      });
      stopAutoBtn.addEventListener('click', ()=>{
        if (!autoHandle) return;
        clearInterval(autoHandle); autoHandle=null; startAutoBtn.disabled=false; stopAutoBtn.disabled=true;
      });
    })();
  </script>
</body>
</html>
