<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cheetos Finder</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/themes.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }
        
        .login-container {
            background: var(--bg-secondary);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            font-size: 28px;
            color: var(--text-primary);
            margin: 10px 0;
        }
        
        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 6px;
            display: none;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="theme-black">
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Admin Panel</h1>
            <p>Cheetos Finder</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Login</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Wpisz login..."
                    required
                    autocomplete="off"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Hasło</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Wpisz hasło..."
                    required
                    autocomplete="off"
                >
            </div>
            
            <button type="submit" class="login-btn">Zaloguj się</button>
            
            <div id="errorMessage" class="error-message"></div>
        </form>
        
        <div class="back-link">
            <a href="/">← Wróć na stronę główną</a>
        </div>
    </div>

    <script>
        const ADMIN_USERNAME = 'larpik';
        const ADMIN_PASSWORD = '2137';
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                // Ustaw sesję
                localStorage.setItem('admin_session', 'true');
                localStorage.setItem('admin_login_time', new Date().toISOString());
                
                // Przekieruj do panelu
                window.location.href = '/admin';
            } else {
                errorMsg.textContent = '❌ Błędny login lub hasło!';
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                
                // Usuń wiadomość po 5 sekundach
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 5000);
            }
        });
        
        // Fokus na input po załadowaniu
        document.getElementById('username').focus();
    </script>
</body>
</html>
